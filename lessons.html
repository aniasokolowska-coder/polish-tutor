:root{--bg:#0f1226;--panel:#1a1f3c;--panel2:#232a52;--accent:#6c8cff;--mint:#43d6a5;--text:#eef1ff;--muted:#9aa3c7;--radius:16px}*{box-sizing:border-box}body{margin:0;padding:24px 16px 70px;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#232a52 0%,var(--bg) 60%)}.wrap{max-width:1000px;margin:auto}header{text-align:center;margin-bottom:20px}h1{margin:0 0 6px;font-size:1.7rem}header p,.note,.muted{color:var(--muted);line-height:1.55}header p{margin:0}.links,.level-bar,.voice-row{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.links{margin-top:14px}a.btn,button{font:inherit;border:0;border-radius:12px;padding:9px 15px;cursor:pointer;background:var(--panel2);color:var(--text);text-decoration:none}a.btn:hover,button:hover{background:#344078}a.btn.primary,button.primary{background:var(--accent);color:#0b0f24;font-weight:700}.level-bar{margin:18px 0 14px}.level{background:var(--panel);border:1px solid rgba(255,255,255,.08);color:var(--muted);padding:10px 18px;border-radius:12px;font-weight:650}.level.active{background:var(--mint);color:#06231a}.voice-row{justify-content:flex-end;margin:0 0 12px;color:var(--muted);font-size:.88rem}.voice-row select,select{font:inherit;color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:10px;background:var(--panel2);padding:8px 11px;max-width:280px}.status{color:var(--muted);font-size:.85rem}.lesson-tabs{display:flex;gap:8px;overflow-x:auto;padding:5px 2px 12px}.lesson-tab{white-space:nowrap;border-radius:999px;padding:8px 14px;font-size:.88rem}.lesson-tab.active{background:var(--accent);color:#0b0f24;font-weight:700}.lesson-tab.done:after{content:" ✓";color:var(--mint)}.panel{background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.panel h2{margin:0 0 8px}.section{margin:20px 0}.section h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mint);margin:0 0 10px}.vocab{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 12px;color:var(--text);cursor:pointer}.chip span{color:var(--muted);margin-left:5px;font-size:.88rem}.dialogue{display:grid;gap:9px}.line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:#141936}.pl{font-weight:650}.en{color:var(--muted);font-size:.9rem;margin-top:3px}.line button{padding:6px 10px;flex-shrink:0}.tip{background:rgba(108,140,255,.1);border-left:3px solid var(--accent);padding:12px 15px;border-radius:8px;line-height:1.55}.grammar-list,.overview-list{line-height:1.65;padding-left:21px}.grammar-list li,.overview-list li{margin:5px 0}.task{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:13px;margin:10px 0}.task h4{margin:0 0 6px;color:var(--accent-2,var(--mint));font-size:.9rem}.task p{margin:0 0 10px;line-height:1.5}.task textarea{width:100%;min-height:76px;resize:vertical;background:#121734;color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;font:inherit;line-height:1.5}.task textarea:focus{outline:2px solid var(--accent)}.task-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.task-actions button{font-size:.82rem;padding:7px 11px}.saved{color:var(--muted);font-size:.8rem}.progress{display:flex;align-items:center;gap:9px;padding-top:12px}.progress input{accent-color:var(--mint);width:17px;height:17px}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.08)}th{color:var(--muted)}@media(max-width:640px){body{padding:18px 10px 48px}.panel{padding:16px}.voice-row{justify-content:center}.line{padding:9px}.chip{font-size:.9rem}}

"use strict";
var courses={
A1:{name:"Beginner foundations",summary:"Build basic conversations with greetings, everyday needs, present tense, and useful case patterns.",lessons:[
{title:"Greetings & introductions",tip:"Polish often omits subject pronouns because the verb ending gives clues. In polite conversation, use pan/pani with third-person verb forms: Czy mówi pan po angielsku?",vocab:[["Cześć","hi / bye (informal)"],["Dzień dobry","hello / good morning"],["Do widzenia","goodbye"],["Mam na imię…","My name is…"],["Jestem z…","I am from…"],["Miło mi","Nice to meet you"],["Dziękuję","thank you"],["Proszę","please / here you are"]],dialogue:[["Dzień dobry! Jak ma pani na imię?","Hello! What is your name? (polite)"],["Mam na imię Anna. A pan?","My name is Anna. And you? (polite)"],["Jestem Marek. Miło mi.","I’m Marek. Nice to meet you."],["Mnie również. Do widzenia!","Likewise. Goodbye!"]],grammar:["Present tense of być (to be): jestem, jesteś, jest, jesteśmy, jesteście, są.","Personal names after mam na imię stay in the nominative: Mam na imię Anna.","Use jestem + z + place: Jestem z Polski (I’m from Poland). City names may change after z: Jestem z Warszawy.","Informal tu contrasts with polite pan/pani; polite questions use third-person verbs."],speaking:["Introduce yourself with your name, home town, and one language you speak.","Role-play meeting someone: greet them, ask their name, and say nice to meet you."],writing:["Write a 4–6 sentence profile: name, home town, languages, and one hobby.","Write a short first message to a Polish host family."],describe:["Describe a person you know: name, where they are from, languages, and two simple traits."]},
{title:"Café, food & polite requests",tip:"A direct object often takes the accusative. Feminine -a nouns commonly change to -ę: kawa → kawę. Learn frequent phrases as useful chunks.",vocab:[["kawa","coffee"],["herbata","tea"],["woda","water"],["chleb","bread"],["jabłko","apple"],["Poproszę…","I’d like…"],["Ile kosztuje?","How much does it cost?"],["rachunek","bill"]],dialogue:[["Dzień dobry. Poproszę kawę i wodę.","Hello. I’d like a coffee and water."],["Czy coś jeszcze?","Anything else?"],["Nie, dziękuję. Ile płacę?","No, thank you. How much do I owe?"],["Dwadzieścia złotych.","Twenty zlotys."]],grammar:["Poproszę + accusative is a common polite way to order: poproszę kawę, herbatę, wodę.","Feminine nouns ending in -a often take -ę in the singular accusative: kawa → kawę; exceptions exist.","Masculine inanimate nouns often look the same in nominative and accusative: chleb → chleb.","Negation: Nie chcę kawy. After a negated transitive verb, the object commonly appears in the genitive."],speaking:["Order a drink and two food items; ask how much they cost.","Ask for a table for two, request a menu, and politely ask for the bill."],writing:["Write a breakfast and lunch shopping list with quantities.","Write a short café review: what you ordered and whether you liked it."],describe:["Describe your usual breakfast using at least five food words and one opinion."]},
{title:"Daily routine & places",tip:"Present-tense verbs change with the subject: mieszkam (I live), mieszkasz (you live), mieszka (he/she lives). Polish usually does not need the pronoun ja.",vocab:[["mieszkać","to live"],["pracować","to work"],["uczyć się","to study / learn"],["rano","in the morning"],["wieczorem","in the evening"],["dom","home / house"],["przystanek","bus stop"],["w lewo / w prawo","left / right"]],dialogue:[["Gdzie mieszkasz?","Where do you live?"],["Mieszkam w Krakowie. A ty?","I live in Kraków. And you?"],["Pracuję w centrum.","I work downtown."],["Jak dojść do przystanku?","How do I get to the bus stop?"]],grammar:["Regular present endings vary by conjugation: mieszkać → mieszkam, mieszkasz, mieszka, mieszkamy, mieszkacie, mieszkają.","Reflexive verbs use się: uczę się (I study), uczysz się (you study). The particle may appear after the verb or later in the clause.","Use w + locative for location: w domu (at home), w Krakowie (in Kraków). Many place forms are irregular and should be learned with the noun.","Basic word order is flexible; keep the topic clear and use stress naturally."],speaking:["Describe a weekday routine from morning until evening.","Ask for directions to a station and repeat the directions you hear."],writing:["Write six sentences about where you live, work, and study.","Plan a day in a Polish town with times and places."],describe:["Describe your neighbourhood and how you travel around it."]}]},
B1:{name:"Independent communication",summary:"Connect ideas, tell stories in past and future time, and notice case patterns after common verbs and prepositions.",lessons:[
{title:"Past experiences & storytelling",tip:"The Polish past tense marks gender in the singular: robiłem (male speaker), robiłam (female speaker). Plural forms distinguish masculine-personal groups (robiliśmy) from non-masculine-personal groups (robiłyśmy).",vocab:[["w zeszłym tygodniu","last week"],["podróżować","to travel"],["odwiedzić","to visit"],["wydarzenie","event"],["najpierw","first"],["potem","then"],["ponieważ","because"],["udało mi się","I managed to"]],dialogue:[["Co robiłaś w weekend?","What did you do at the weekend? (to a woman)"],["Pojechałam w góry i dużo chodziłam.","I went to the mountains and walked a lot. (female speaker)"],["Czy pogoda dopisała?","Was the weather good?"],["Tak, chociaż wieczorem padał deszcz.","Yes, although it rained in the evening."]],grammar:["Past tense combines a verb stem with person/gender endings: robiłem/robiłam; robiłeś/robiłaś; robił/robiła/robiło.","Plural past endings show group type: robiliśmy (masculine-personal), robiłyśmy (non-masculine-personal).", "Perfective verbs often present an action as completed; imperfective verbs describe process, repetition, or background. Compare robiłem (I was doing/used to do) and zrobiłem (I did/finished).", "Link events with najpierw (first), potem (then), w końcu (finally), and chociaż (although)."],speaking:["Tell a two-minute story about a memorable trip using first, then, and finally.","Interview someone about last weekend and ask at least five follow-up questions."],writing:["Write a diary entry about a day that did not go as planned.","Describe a past celebration and explain why it mattered to you."],describe:["Recount a journey: destination, transport, companions, and what happened."]},
{title:"Plans, invitations & opinions",tip:"Imperfective future commonly uses będę + infinitive (będę pracować) or będę + masculine/feminine past-like form (będę pracował/pracowała). Perfective verbs form a simple future: napiszę (I’ll write).",vocab:[["mieć ochotę","to feel like"],["może","maybe"],["zamiast","instead of"],["zgadzać się","to agree"],["uważam, że…","I think that…"],["zależeć od","to depend on"],["spotkać się","to meet up"],["przełożyć","to reschedule"]],dialogue:[["Masz ochotę pójść w sobotę do kina?","Would you like to go to the cinema on Saturday?"],["Chętnie, ale będę pracować do szóstej.","Gladly, but I’ll be working until six."],["Możemy spotkać się później.","We can meet later."],["Świetnie. Napiszę, kiedy skończę.","Great. I’ll message when I finish."]],grammar:["Imperfective future: będę, będziesz, będzie, będziemy, będziecie, będą + infinitive.","Perfective verbs have simple future forms: napisać → napiszę, napiszesz, napisze, napiszemy, napiszecie, napiszą.","Use conditional forms for polite or hypothetical ideas: chciałbym/chciałabym (I would like), moglibyśmy (we could).", "że introduces a that-clause: Uważam, że to dobry pomysł (I think it’s a good idea)."],speaking:["Invite someone to an event, negotiate a time, and respond politely to a refusal.","Give your opinion on remote work and support it with two reasons."],writing:["Write a message proposing weekend plans and suggesting an alternative.","Compare two holiday options and recommend one to a friend."],describe:["Explain a recent decision, including alternatives and your reasons."]},
{title:"Health, services & problem solving",tip:"With być, predicate adjectives agree with the subject: jestem zmęczony (male speaker), jestem zmęczona (female speaker). After potrzebować, the needed thing commonly takes the genitive.",vocab:[["ból","pain"],["ból głowy","headache"],["umówić wizytę","to make an appointment"],["potrzebować","to need"],["zgubić","to lose"],["zgłaszać","to report"],["ubezpieczenie","insurance"],["proszę powtórzyć","please repeat"]],dialogue:[["Dzień dobry, chciałbym umówić wizytę.","Hello, I’d like to make an appointment. (male speaker)"],["Co się stało?","What happened?"],["Od wczoraj boli mnie gardło.","My throat has hurt since yesterday."],["Czy ma pan/pani gorączkę?","Do you have a fever?"]],grammar:["Need: potrzebuję + genitive: potrzebuję lekarza (I need a doctor), potrzebuję pomocy (I need help).", "Body-part sensations often use boli mnie + body part: Boli mnie głowa (My head hurts).", "Polite requests often use the conditional: chciałbym/chciałabym (I’d like), czy mógłby/mogłaby pan/pani…?", "Since a starting point: od + genitive, as in od wczoraj (since yesterday)."],speaking:["Explain a minor health problem and ask a pharmacist for advice.","Report a lost item and describe when and where you last saw it."],writing:["Write a concise email changing an appointment and suggesting a new time.","Describe a booking problem and request a reasonable solution."],describe:["Explain how to get help in an unfamiliar city, step by step."]}]},
C1:{name:"Advanced nuance & fluency",summary:"Develop precise arguments, register awareness, and flexible storytelling. Support claims, signal uncertainty, and paraphrase naturally.",lessons:[
{title:"Argument & public debate",tip:"Calibrate claims with hedging and attribution: wydaje się, że (it seems that), według… (according to…), z jednej strony… z drugiej strony… (on one hand… on the other).",vocab:[["zagadnienie","issue / topic"],["wiarygodny","reliable"],["przesłanka","premise"],["z jednej strony…","on the one hand…"],["niemniej jednak","nevertheless"],["w świetle danych","in light of the data"],["podważać","to challenge"],["wniosek","conclusion"]],dialogue:[["Czy nowe rozwiązanie rzeczywiście obniży koszty?","Will the new solution really reduce costs?"],["W świetle dostępnych danych jest to prawdopodobne.","In light of available data, that is likely."],["Niemniej jednak pominięto koszty wdrożenia.","Nevertheless, implementation costs were omitted."],["To ważne zastrzeżenie; warto je uwzględnić.","That is an important caveat; it is worth including it."]],grammar:["Separate evidence from inference: Dane wskazują, że… (The data indicate that…); można z tego wnioskować, że… (one can infer that…).", "Use the conditional to soften claims or proposals: warto byłoby rozważyć… (it would be worth considering…).", "Concession: choć/chociaż + clause (although); mimo że + clause (despite the fact that).", "Formal connectors include niemniej jednak (nevertheless), w związku z tym (as a result), and z kolei (in turn)."],speaking:["Present a nuanced argument about a technology that has changed daily life.","Respond to an opposing view without dismissing the person presenting it."],writing:["Write a 250-word opinion piece with a claim, evidence, counterargument, and conclusion.","Summarize a contested issue, distinguishing facts from interpretation."],describe:["Explain a chart or set of results, noting limits and plausible explanations."]},
{title:"Register, diplomacy & persuasion",tip:"Professional requests often use conditional politeness: Czy mogliby Państwo…? (Could you…?). Match titles and verb forms to the audience; avoid translating English idioms word for word.",vocab:[["uprzejmie proszę","I kindly request"],["byłbym/byłabym wdzięczny","I would be grateful"],["kwestia","matter / issue"],["doprecyzować","to clarify"],["zależy mi na","I care about / need"],["wątpliwość","concern / doubt"],["kompromis","compromise"],["podtrzymać stanowisko","to maintain a position"]],dialogue:[["Czy mogliby Państwo doprecyzować harmonogram?","Could you clarify the schedule?"],["Oczywiście. Prześlemy zaktualizowaną wersję jutro.","Of course. We’ll send the updated version tomorrow."],["Byłbym wdzięczny, gdyby uwzględnili Państwo tę zmianę.","I’d be grateful if you could include this change. (male speaker)"],["Weźmiemy to pod uwagę.","We’ll take that into account."]],grammar:["Formal plural Państwo takes third-person plural verbs: Czy mogliby Państwo…? Państwo prześlą…", "Conditional politeness: Czy byłaby możliwość…? (Would it be possible…?) and Byłbym/byłabym wdzięczny/wdzięczna za…", "In professional writing, use a clear greeting, concise context, an explicit request, and an appropriate closing.", "Softening expressions include chciałbym/chciałabym zwrócić uwagę (I’d like to point out) and być może warto (perhaps it is worth)."],speaking:["Negotiate a deadline while acknowledging the other person’s constraints.","Rephrase a blunt complaint as a firm but diplomatic request."],writing:["Draft a formal email asking for clarification and proposing next steps.","Write a short persuasive proposal tailored to a skeptical audience."],describe:["Describe a disagreement and explain how each party could reach a compromise."]},
{title:"Culture, media & interpretation",tip:"When analyzing a text, distinguish what it states from what it implies. Useful frames include autor sugeruje… (the author suggests…) and można to odczytać jako… (this can be read as…).",vocab:[["przekaz","message"],["wymowa","implication / significance"],["zjawisko","phenomenon"],["przedstawiać","to present / depict"],["odzwierciedlać","to reflect"],["narracja","narrative"],["w pewnym stopniu","to some extent"],["interpretacja","interpretation"]],dialogue:[["Jak interpretujesz zakończenie tego filmu?","How do you interpret the ending of this film?"],["Można je odczytać jako krytykę bezczynności.","It can be read as a critique of inaction."],["Czy autor jednoznacznie sugeruje takie rozwiązanie?","Does the author clearly suggest that solution?"],["Nie, pozostawia odbiorcy przestrzeń do interpretacji.","No, the audience is left room to interpret it."]],grammar:["Reported speech: autor twierdzi, że… (the author claims that…); according to the verb, Polish may use past, present, or conditional forms.","Imperfective aspect presents process or repetition; perfective aspect presents a bounded event or result.","Use nie wynika z tego jednak… (it does not follow, however…) to signal a limit on an inference.","Paraphrase with innymi słowy (in other words), czyli (that is), and mówiąc inaczej (put differently)."],speaking:["Analyze how a film or book creates sympathy for one character.","Discuss whether social media broadens or narrows public debate."],writing:["Write a review that evaluates style and substance separately.","Compare two media accounts of the same event and discuss their framing."],describe:["Interpret a cultural practice for someone unfamiliar with its context, avoiding stereotypes."]}]}
};
var level="A1",index=0,key="polish-tutor-lesson-progress-v1",progress={};
try{progress=JSON.parse(localStorage.getItem(key)||"{}");}catch(error){progress={};}
var levels=document.getElementById("levels"),tabs=document.getElementById("lessonTabs"),panel=document.getElementById("lessonPanel"),voiceSelect=document.getElementById("voiceSelect"),voiceStatus=document.getElementById("voiceStatus"),voices=[],activeUtterance=null;
function save(){try{localStorage.setItem(key,JSON.stringify(progress));}catch(error){}}
function esc(value){return String(value).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function renderLevels(){levels.innerHTML="";Object.keys(courses).forEach(function(name){var button=document.createElement("button");button.type="button";button.className="level"+(name===level?" active":"");button.textContent=name;button.setAttribute("role","tab");button.setAttribute("aria-selected",name===level?"true":"false");button.addEventListener("click",function(){level=name;index=0;render();});levels.appendChild(button);});}
function renderTabs(){tabs.innerHTML="";courses[level].lessons.forEach(function(item,i){var button=document.createElement("button"),saved=progress[level+"-"+i];button.type="button";button.className="lesson-tab"+(i===index?" active":"")+(saved&&saved.done?" done":"");button.textContent=(i+1)+". "+item.title;button.addEventListener("click",function(){index=i;render();});tabs.appendChild(button);});}
function render(){renderLevels();renderTabs();var item=courses[level].lessons[index],lessonKey=level+"-"+index,saved=progress[lessonKey]||{answers:{},done:false},html="<h2>"+esc(level+" · "+item.title)+"</h2><p class='note'>"+esc(courses[level].summary)+"</p><div class='tip'>"+esc(item.tip)+"</div>";
html+="<section class='section'><h3>Vocabulary — tap to hear</h3><div class='vocab'>"+item.vocab.map(function(pair){return "<button class='chip' type='button' data-say='"+esc(pair[0])+"'>"+esc(pair[0])+" <span>"+esc(pair[1])+"</span></button>";}).join("")+"</div></section>";
html+="<section class='section'><h3>Dialogue — listen and repeat</h3><div class='dialogue'>"+item.dialogue.map(function(line){return "<div class='line'><div><div class='pl'>"+esc(line[0])+"</div><div class='en'>"+esc(line[1])+"</div></div><button type='button' data-say='"+esc(line[0])+"' aria-label='Listen to Polish'>Listen</button></div>";}).join("")+"</div></section>";
html+="<section class='section'><h3>Grammar</h3><ul class='grammar-list'>"+item.grammar.map(function(text){return "<li>"+esc(text)+"</li>";}).join("")+"</ul></section>";
[["Speaking",item.speaking],["Writing",item.writing],["Describe",item.describe]].forEach(function(group){html+="<section class='section'><h3>"+group[0]+" practice</h3>";group[1].forEach(function(prompt,i){var id=group[0].toLowerCase()+"-"+i,answer=(saved.answers||{})[id]||"";html+="<article class='task'><h4>"+group[0]+" prompt "+(i+1)+"</h4><p>"+esc(prompt)+"</p><textarea data-answer='"+id+"' aria-label='"+group[0]+" response' placeholder='Write your answer in Polish…'>"+esc(answer)+"</textarea><div class='task-actions'><button type='button' data-mic='"+id+"'>Dictate</button><span class='saved' data-saved='"+id+"'>"+(answer?"Saved on this device":"Not answered")+"</span></div></article>";});html+="</section>";});
html+="<div class='progress'><input type='checkbox' id='doneCheck'"+(saved.done?" checked":"")+"><label for='doneCheck'>Mark this lesson complete</label></div>";panel.innerHTML=html;wirePanel(lessonKey);}
function wirePanel(lessonKey){panel.querySelectorAll("[data-say]").forEach(function(button){button.addEventListener("click",function(){speak(button.getAttribute("data-say"));});});panel.querySelectorAll("[data-answer]").forEach(function(area){area.addEventListener("input",function(){var record=progress[lessonKey]||{answers:{},done:false};record.answers=record.answers||{};record.answers[area.getAttribute("data-answer")]=area.value;progress[lessonKey]=record;save();var marker=panel.querySelector("[data-saved='"+area.getAttribute("data-answer")+"']");if(marker)marker.textContent=area.value?"Saved on this device":"Not answered";});});panel.querySelectorAll("[data-mic]").forEach(function(button){button.addEventListener("click",function(){var Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){voiceStatus.textContent="Speech recognition is not available in this browser. Try Chrome or Edge.";return;}var area=panel.querySelector("[data-answer='"+button.getAttribute("data-mic")+"']"),recognition=new Recognition();recognition.lang="pl-PL";recognition.interimResults=false;recognition.maxAlternatives=1;voiceStatus.textContent="Listening in Polish…";recognition.onresult=function(event){area.value+=(area.value?" ":"")+event.results[0][0].transcript;area.dispatchEvent(new Event("input"));};recognition.onerror=function(event){voiceStatus.textContent="Microphone error: "+event.error;};recognition.onend=function(){if(voiceStatus.textContent==="Listening in Polish…")voiceStatus.textContent="";};try{recognition.start();}catch(error){voiceStatus.textContent="Could not start microphone: "+error.message;}});});var check=document.getElementById("doneCheck");check.addEventListener("change",function(){var record=progress[lessonKey]||{answers:{},done:false};record.done=check.checked;progress[lessonKey]=record;save();renderTabs();});}
function refreshVoices(){if(!("speechSynthesis"in window))return;voices=window.speechSynthesis.getVoices()||[];var saved="";try{saved=localStorage.getItem("polish-tutor-lesson-voice")||"";}catch(error){}var polish=voices.filter(function(voice){return voice.lang&&voice.lang.toLowerCase().indexOf("pl-")===0;});voiceSelect.innerHTML="";var automatic=document.createElement("option");automatic.value="";automatic.textContent="Automatic Polish voice";voiceSelect.appendChild(automatic);polish.forEach(function(voice){var option=document.createElement("option");option.value=voice.voiceURI||voice.name;option.textContent=voice.name+" ("+voice.lang+")";voiceSelect.appendChild(option);});voiceSelect.value=polish.some(function(voice){return(voice.voiceURI||voice.name)===saved;})?saved:"";}
function speak(text){if(!("speechSynthesis"in window)){voiceStatus.textContent="Speech playback is not available in this browser.";return;}var synth=window.speechSynthesis;voices=synth.getVoices()||voices;if(synth.speaking||synth.pending)synth.cancel();var utterance=new SpeechSynthesisUtterance(text),chosen=voices.filter(function(voice){return(voice.voiceURI||voice.name)===voiceSelect.value&&voice.lang&&voice.lang.toLowerCase().indexOf("pl-")===0;})[0];utterance.lang=chosen?chosen.lang:"pl-PL";utterance.rate=.9;if(chosen)utterance.voice=chosen;activeUtterance=utterance;utterance.onstart=function(){if(activeUtterance===utterance)voiceStatus.textContent="Speaking…";};utterance.onend=function(){if(activeUtterance===utterance){activeUtterance=null;voiceStatus.textContent="Finished speaking.";}};utterance.onerror=function(event){if(activeUtterance===utterance){activeUtterance=null;voiceStatus.textContent="Speech error: "+(event.error||"voice unavailable");}};synth.speak(utterance);}
voiceSelect.addEventListener("change",function(){try{localStorage.setItem("polish-tutor-lesson-voice",voiceSelect.value);}catch(error){}voiceStatus.textContent=voiceSelect.value?"Polish voice selected.":"Using the automatic system voice.";});document.getElementById("testVoice").addEventListener("click",function(){speak("Cześć! To jest próba polskiej wymowy.");});if("speechSynthesis"in window){refreshVoices();window.speechSynthesis.onvoiceschanged=refreshVoices;window.setTimeout(refreshVoices,300);}render();
